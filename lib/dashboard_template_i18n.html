<style>
:root{
  --bg:#0e2919; --bg-elevated:#153524; --bg-card:#1b422e; --border:#2c5b41;
  --text:#F2EFE3; --text2:#A7C4AE; --muted:#6E8F77;
  --gold:#E0B23D; --red:#C4453F; --blue:#3E90B0; --violet:#9B7FC4; --lime:#9BC24A;
  --radius:10px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
  line-height:1.55; -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(ellipse at top left, rgba(224,178,61,0.06), transparent 45%),
    radial-gradient(ellipse at bottom right, rgba(62,144,176,0.06), transparent 45%);
}
h1,h2,h3{font-family:'Bebas Neue',sans-serif; font-weight:400; letter-spacing:0.01em;}
.mono{font-family:'JetBrains Mono',monospace;}
.container{max-width:1180px; margin:0 auto; padding:0 28px;}
a{color:inherit;}

nav{position:sticky; top:0; z-index:100; background:rgba(14,41,25,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);}
nav .container{display:flex; align-items:center; justify-content:space-between; height:64px;}
.logo{display:flex; align-items:center; gap:10px; font-family:'Bebas Neue'; font-size:22px; letter-spacing:0.02em;}
.logo .ball{font-size:20px;}
.navlinks{list-style:none; display:flex; align-items:center; gap:20px;}
nav a.navlink{font-size:13px; color:var(--text2); text-decoration:none; text-transform:uppercase; letter-spacing:0.04em; transition:color .15s;}
nav a.navlink:hover{color:var(--gold);}
@media(max-width:900px){.navlinks li:not(.lang-item){display:none;}}
.lang-switch{display:flex; gap:6px;}
.lang-switch a{font-family:'JetBrains Mono'; font-size:11px; padding:5px 9px; border:1px solid var(--border); border-radius:6px; color:var(--text2); text-decoration:none;}
.lang-switch a.active{color:var(--bg); background:var(--gold); border-color:var(--gold); font-weight:700;}

.hero{padding:70px 0 30px; position:relative; overflow:hidden;}
.pitch-arc{position:absolute; top:-180px; right:-180px; width:420px; height:420px; border:2px solid rgba(242,239,227,0.06); border-radius:50%; pointer-events:none;}
.pitch-arc::after{content:''; position:absolute; inset:60px; border:2px solid rgba(242,239,227,0.05); border-radius:50%;}
.eyebrow{font-family:'JetBrains Mono'; font-size:12px; text-transform:uppercase; letter-spacing:.14em; color:var(--gold); margin-bottom:16px; display:flex; align-items:center; gap:10px;}
.eyebrow::before{content:''; width:22px; height:1px; background:var(--gold);}
.hero h1{font-size:clamp(46px,7vw,84px); line-height:0.95; max-width:820px; margin-bottom:20px; text-transform:uppercase;}
.hero h1 em{font-style:normal; color:var(--gold);}
.hero p{font-size:17px; color:var(--text2); max-width:600px; margin-bottom:8px;}

.scoreboard{margin-top:44px; display:flex; gap:2px; flex-wrap:wrap; border-radius:var(--radius); overflow:hidden; border:1px solid var(--border);}
.score-cell{flex:1; min-width:130px; background:var(--bg-elevated); padding:20px 18px; text-align:center; border-right:1px solid var(--border);}
.score-cell:last-child{border-right:none;}
.score-cell .num{font-family:'JetBrains Mono'; font-size:34px; font-weight:700; color:var(--gold); letter-spacing:-0.02em;}
.score-cell .lbl{font-size:10.5px; color:var(--text2); text-transform:uppercase; letter-spacing:.08em; margin-top:4px;}

section{padding:64px 0;}
section.alt{background:var(--bg-elevated); border-top:1px solid var(--border); border-bottom:1px solid var(--border);}
.section-head{margin-bottom:34px; max-width:660px;}
.section-head .eyebrow-sm{font-family:'JetBrains Mono'; font-size:11.5px; color:var(--gold); text-transform:uppercase; letter-spacing:.1em; margin-bottom:8px;}
.section-head h2{font-size:clamp(28px,3.6vw,40px); margin-bottom:10px; text-transform:uppercase;}
.section-head p{color:var(--text2); font-size:15px;}

.pipeline{display:grid; grid-template-columns:repeat(5,1fr); gap:14px;}
@media(max-width:900px){.pipeline{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.pipeline{grid-template-columns:1fr;}}
.stage{background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:20px 18px; border-top:3px solid var(--gold);}
.stage .idx{font-family:'JetBrains Mono'; font-size:12px; color:var(--gold); margin-bottom:12px;}
.stage h3{font-size:19px; margin-bottom:8px; letter-spacing:0.01em;}
.stage p{font-size:12.5px; color:var(--text2); margin-bottom:12px; min-height:60px;}
.tags{display:flex; flex-wrap:wrap; gap:5px;}
.tag{font-family:'JetBrains Mono'; font-size:10px; padding:3px 7px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:5px; color:var(--text2);}

.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
@media(max-width:900px){.grid-2{grid-template-columns:1fr;}}
.card{background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:22px;}
.card h3{font-size:20px; margin-bottom:2px; text-transform:uppercase;}
.card .sub{font-size:12px; color:var(--muted); margin-bottom:16px;}
.card canvas{max-height:280px;}
.chart-error{font-size:12.5px; color:var(--muted); padding:30px 0; text-align:center;}

.legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:14px;}
.legend-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text2);}
.legend-dot{width:9px; height:9px; border-radius:50%;}

.filter-bar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px;}
.filter-btn{font-family:'JetBrains Mono'; font-size:11.5px; padding:7px 13px; border-radius:20px; border:1px solid var(--border); background:var(--bg-card); color:var(--text2); cursor:pointer; transition:all .15s;}
.filter-btn:hover{border-color:var(--gold); color:var(--text);}
.filter-btn.active{background:var(--gold); color:var(--bg); border-color:var(--gold); font-weight:700;}
select.filter-select{font-family:'JetBrains Mono'; font-size:12px; padding:8px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg-card); color:var(--text); cursor:pointer;}

.cromo-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:14px;}
.cromo{background:linear-gradient(160deg, var(--bg-card), var(--bg-elevated)); border:1px solid var(--border); border-radius:12px; padding:16px 14px; position:relative; border-top:4px solid var(--gold); transition:transform .15s;}
.cromo:hover{transform:translateY(-3px);}
.cromo .rank-badge{position:absolute; top:10px; right:10px; font-family:'JetBrains Mono'; font-size:10px; color:var(--muted);}
.cromo .avatar{width:54px; height:54px; border-radius:50%; background:var(--bg-elevated); border:2px solid var(--gold); display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue'; font-size:20px; color:var(--gold); margin-bottom:10px;}
.cromo .flag{font-size:22px; margin-bottom:6px;}
.cromo .name{font-size:14.5px; font-weight:700; line-height:1.2; margin-bottom:2px;}
.cromo .team{font-size:11px; color:var(--text2); margin-bottom:10px;}
.cromo .stats{display:flex; gap:12px; border-top:1px dashed var(--border); padding-top:8px;}
.cromo .stat{font-family:'JetBrains Mono';}
.cromo .stat .v{font-size:17px; font-weight:700; color:var(--gold);}
.cromo .stat .k{font-size:9px; color:var(--muted); text-transform:uppercase;}

.rank-table{width:100%; border-collapse:collapse;}
.table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
@media(max-width:640px){.rank-table{min-width:480px;}}
.rank-table th{text-align:left; font-family:'JetBrains Mono'; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--border);}
.rank-table td{padding:11px 12px; border-bottom:1px solid var(--border); font-size:13.5px;}
.rank-table tr:hover td{background:var(--bg-elevated);}
.rank-table .pos{font-family:'JetBrains Mono'; color:var(--gold); font-weight:700;}
.rank-table .bar-cell{width:140px;}
.power-bar-track{height:6px; background:var(--bg); border-radius:3px; overflow:hidden;}
.power-bar-fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--red)); border-radius:3px;}
.stage-pill{font-family:'JetBrains Mono'; font-size:9.5px; padding:3px 8px; border-radius:5px; background:var(--bg-elevated); color:var(--text2); white-space:nowrap;}

.match-row{display:grid; grid-template-columns:90px 1fr 70px 1fr 90px; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--border); font-size:13.5px;}
.match-row:hover{background:var(--bg-elevated);}
.match-row .fase-tag{font-family:'JetBrains Mono'; font-size:9.5px; color:var(--muted);}
.match-row .team-name{display:flex; align-items:center; gap:8px;}
.match-row .score{font-family:'JetBrains Mono'; font-weight:700; text-align:center; color:var(--gold); font-size:15px;}
.match-row .fecha{font-family:'JetBrains Mono'; font-size:11px; color:var(--muted); text-align:right;}
.match-list{max-height:520px; overflow-y:auto; border:1px solid var(--border); border-radius:var(--radius);}
.match-count{font-family:'JetBrains Mono'; font-size:12px; color:var(--muted); margin-bottom:10px;}
@media(max-width:640px){
  .match-row{grid-template-columns:1fr 46px 1fr; gap:6px; padding:11px 12px; font-size:12px;}
  .match-row .fase-tag, .match-row .fecha{display:none;}
  .match-row .score{font-size:13px;}
}

.metric-highlight{display:flex; align-items:baseline; gap:10px; margin-bottom:6px;}
.metric-highlight .big{font-family:'JetBrains Mono'; font-size:36px; font-weight:700; color:var(--lime);}
.metric-highlight .vs{font-size:13px; color:var(--muted);}

.stack-badges{display:flex; flex-wrap:wrap; gap:10px;}
.badge{display:flex; align-items:center; gap:8px; padding:9px 14px; background:var(--bg-card); border:1px solid var(--border); border-radius:8px; font-size:13px;}
.badge .dot{width:7px; height:7px; border-radius:50%;}

footer{padding:40px 0; text-align:center; border-top:1px solid var(--border);}
footer p{font-size:12.5px; color:var(--muted);}
</style>
</head>

const LANG = "__LANG__";
const I18N = {

const T = I18N[LANG] || I18N.es;

function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(T[key] !== undefined) el.textContent = T[key];
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{
    const key = el.getAttribute('data-i18n-html');
    if(T[key] !== undefined) el.innerHTML = T[key];
  });
}
applyI18n();

let EDA={}, TEAM_SPACE=[], TOP20_TEAMS=[], SCORERS=[], MATCHES=[], METRICS={};
try{
  EDA = JSON.parse(document.getElementById('data-eda').textContent);

  MATCHES = JSON.parse(document.getElementById('data-matches').textContent);
  METRICS = JSON.parse(document.getElementById('data-metrics').textContent);
}catch(e){ console.error('Error parsing embedded data', e); }

const PALETTE = ['#E0B23D','#C4453F','#3E90B0','#9B7FC4','#9BC24A','#E08A3D'];
const TXT2 = '#A7C4AE';
const GRID = 'rgba(255,255,255,0.05)';

if(typeof Chart !== 'undefined'){
  Chart.defaults.color = TXT2;
  Chart.defaults.font.family = "'Inter', sans-serif";
  Chart.defaults.font.size = 11.5;
}

function safeChart(canvasId, config){
  try{
    if(typeof Chart === 'undefined') throw new Error('Chart.js unavailable');
    const el = document.getElementById(canvasId);
    if(!el) return null;
    return new Chart(el, config);
  }catch(err){
    console.error('Chart error ['+canvasId+']', err);
    const el = document.getElementById(canvasId);
    if(el && el.parentNode){
      const msg = document.createElement('div');
      msg.className = 'chart-error';
      msg.textContent = T.chart_error;
      el.parentNode.replaceChild(msg, el);
    }
    return null;
  }
}
function baseOpts(extra){
  return Object.assign({
    responsive:true,
    plugins:{legend:{display:false}},
    scales:{
      x:{grid:{color:GRID}, ticks:{color:TXT2}},
      y:{grid:{color:GRID}, ticks:{color:TXT2}}
    }
  }, extra||{});
}

try{
  const totalGoals = MATCHES.reduce((s,m)=>s+m.total_goles, 0);

}catch(e){ console.error(e); }

(function(){
  try{
    const clusters = {};
    TEAM_SPACE.forEach(d=>{
      if(!clusters[d.cluster_name]) clusters[d.cluster_name]=[];
      clusters[d.cluster_name].push({x:d.pca_x, y:d.pca_y, meta:d});
    });
    const names = Object.keys(clusters);
    const datasets = names.map((name,i)=>({
      label:name, data:clusters[name], backgroundColor: PALETTE[i%PALETTE.length]+'cc',
      pointRadius:5, pointHoverRadius:8,
    }));
    safeChart('chart-space', {
      type:'scatter',
      data:{datasets},
      options:{
        responsive:true,
        plugins:{legend:{display:false}, tooltip:{callbacks:{label:(c)=>{
          const m = c.raw.meta;
          return `${m.bandera} ${m.team} — ${m.etapa_final} (${m.goles_favor}-${m.goles_contra})`;
        }}}},
        scales:{
          x:{grid:{color:GRID}, ticks:{display:false}, title:{display:true,text:T.axis_pca1,color:TXT2}},
          y:{grid:{color:GRID}, ticks:{display:false}, title:{display:true,text:T.axis_pca2,color:TXT2}}
        }
      }
    });
    const legendWrap = document.getElementById('space-legend');
    names.forEach((name,i)=>{
      const el = document.createElement('div');
      el.className='legend-item';
      el.innerHTML = `<span class="legend-dot" style="background:${PALETTE[i%PALETTE.length]}"></span>${name} (${clusters[name].length})`;
      legendWrap.appendChild(el);
    });
  }catch(e){ console.error(e); }
})();

(function(){
  const grid = document.getElementById('cromo-grid');
  const filterBar = document.getElementById('scorer-filters');
  if(!grid) return;

  function initials(name){
    return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  }
  function renderCromos(list){
    grid.innerHTML = '';
    list.forEach(p=>{
      const card = document.createElement('div');
      card.className = 'cromo';
      card.innerHTML = `
        <div class="rank-badge">#${p.rank}</div>
        <div class="avatar">${initials(p.jugador)}</div>
        <div class="flag">${p.bandera}</div>
        <div class="name">${p.jugador}</div>
        <div class="team">${p.equipo}</div>
        <div class="stats">
          <div class="stat"><div class="v">${p.goles}</div><div class="k">${T.cromo_goals}</div></div>
          <div class="stat"><div class="v">${p.asistencias||0}</div><div class="k">${T.cromo_assists}</div></div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  const confeds = [T.filter_all, ...new Set(SCORERS.map(p=>{
    const t = TEAM_SPACE.find(t=>t.team === p.equipo);
    return t ? t.confederacion : 'Other';
  }))];
  filterBar.innerHTML = '';
  confeds.forEach((c,i)=>{
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (i===0 ? ' active' : '');
    btn.textContent = c;
    btn.addEventListener('click', ()=>{
      filterBar.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      if(c === T.filter_all) renderCromos(SCORERS);
      else renderCromos(SCORERS.filter(p=>{
        const t = TEAM_SPACE.find(t=>t.team === p.equipo);
        return t && t.confederacion === c;
      }));
    });
    filterBar.appendChild(btn);
  });
  renderCromos(SCORERS);
})();

(function(){
  const tbody = document.getElementById('ranking-tbody');
  const filterBar = document.getElementById('team-filters');
  if(!tbody) return;

  function renderRanking(list){
    tbody.innerHTML = '';
    list.forEach(t=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="pos">#${t.power_rank}</td>
        <td>${t.bandera} ${t.team}</td>
        <td><span class="stage-pill">${t.etapa_final}</span></td>
        <td class="mono">${t.dif_goles > 0 ? '+' : ''}${t.dif_goles}</td>
        <td class="bar-cell">
          <div class="power-bar-track"><div class="power-bar-fill" style="width:${t.power_score}%"></div></div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  const confeds = [T.filter_all, ...new Set(TOP20_TEAMS.map(t=>t.confederacion))];
  filterBar.innerHTML = '';
  confeds.forEach((c,i)=>{
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (i===0 ? ' active' : '');
    btn.textContent = c;
    btn.addEventListener('click', ()=>{
      filterBar.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      if(c === T.filter_all) renderRanking(TOP20_TEAMS);
      else renderRanking(TOP20_TEAMS.filter(t=>t.confederacion === c));
    });
    filterBar.appendChild(btn);
  });
  renderRanking(TOP20_TEAMS);
})();

(function(){
  const list = document.getElementById('match-list');
  const countEl = document.getElementById('match-count');
  const faseSelect = document.getElementById('filter-fase');
  const grupoSelect = document.getElementById('filter-grupo');
  if(!list) return;

  const fases = [T.filter_all_stages, ...new Set(MATCHES.map(m=>m.fase))];
  faseSelect.innerHTML = fases.map(f=>`<option value="${f}">${f}</option>`).join('');

  const gruposUnicos = [...new Set(MATCHES.filter(m=>m.grupo).map(m=>m.grupo))].sort();
  const grupos = [T.filter_all_groups, ...gruposUnicos];
  grupoSelect.innerHTML = grupos.map(g=>`<option value="${g}">${g === T.filter_all_groups ? g : T.group_prefix + g}</option>`).join('');

  function renderMatches(){
    const fase = faseSelect.value;
    const grupo = grupoSelect.value;
    let filtered = MATCHES;
    if(fase !== T.filter_all_stages) filtered = filtered.filter(m=>m.fase === fase);
    if(grupo !== T.filter_all_groups) filtered = filtered.filter(m=>m.grupo === grupo);

    countEl.textContent = `${filtered.length} ${filtered.length===1?T.match_word:T.matches_word}`;
    list.innerHTML = '';
    filtered.forEach(m=>{
      const row = document.createElement('div');
      row.className = 'match-row';
      row.innerHTML = `
        <div class="fase-tag">${m.grupo ? T.group_prefix+m.grupo : m.fase}</div>
        <div class="team-name">${m.bandera_local||''} ${m.local}</div>
        <div class="score">${m.goles_local} - ${m.goles_visitante}</div>
        <div class="team-name">${m.bandera_visitante||''} ${m.visitante}</div>
        <div class="fecha">${m.fecha}</div>
      `;
      list.appendChild(row);
    });
  }
  faseSelect.addEventListener('change', renderMatches);
  grupoSelect.addEventListener('change', renderMatches);
  renderMatches();
})();

  safeChart('chart-importance', {
