<text x="80" y="95" font-family="DejaVu Sans" font-size="24" font-weight="bold" letter-spacing="2.5" fill="#E0B23D">DATA SCIENCE PORTFOLIO · SOCCER</text>

<text x="76" y="185" font-family="DejaVu Sans" font-size="82" font-weight="bold" fill="#F2EFE3">Anatomy of</text>
<text x="76" y="270" font-family="DejaVu Sans" font-size="82" font-weight="bold" fill="url(#titleGrad)">a World Cup</text>

<!-- scoreboard strip, como el hero del dashboard -->
