<rect x="80" y="470" width="8" height="130" rx="4" fill="#E0B23D"/>
<text x="115" y="560" font-family="DejaVu Sans Mono" font-size="60" font-weight="bold" fill="#F2EFE3">104</text>
<text x="440" y="500" font-family="DejaVu Sans" font-size="26" fill="#A7C4AE"><tspan x="440" dy="0">matches analyzed and</tspan><tspan x="440" dy="32">manually verified</tspan></text>

