<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#E0B23D"/>
    <stop offset="100%" stop-color="#C4453F"/>
  </linearGradient>
</defs>
<rect width="1080" height="1350" fill="#0e2919"/>

<!-- pitch arc motif (mismo elemento del dashboard) -->
<circle cx="1040" cy="40" r="210" fill="none" stroke="rgba(242,239,227,0.06)" stroke-width="2"/>
